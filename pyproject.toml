[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "memory-poisoning-analysis"
version = "0.1.0"
description = "Black-box memory-poisoning experiment harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "ollama>=0.6,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0.2,<7",
    "typer>=0.16,<1",
]

[project.scripts]
membench = "membench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]
telemem-runtime = ["telemem==1.10.0"]
memanto-runtime = [
    "memanto==0.2.17",
    "moorcheh-client==0.1.5",
]
langgraph-runtime = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/membench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
